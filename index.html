<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Matter &amp; Statistical Physics Group — IIT (BHU) Varanasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-row wrap" style="padding-left:0;padding-right:0;">
    <a class="wordmark" href="#home" data-target="home">Soft Matter &amp; Statistical Physics Group
      <small>Department of Physics · IIT (BHU) Varanasi</small>
    </a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#home" data-target="home">Home</a></li>
        <li><a href="#research" data-target="research">Research</a></li>
        <li><a href="#publications" data-target="publications">Publications</a></li>
        <li><a href="#people" data-target="people">People</a></li>
        <li><a href="#gallery" data-target="gallery">Gallery</a></li>
        <li><a href="#contact" data-target="contact">Contact</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
</header>

<main id="sectionsRoot">
  <div class="wrap section-block" id="loadingNotice">
    <p style="color:var(--ink-soft);">Loading…</p>
  </div>
</main>

<footer class="wrap">
  <div class="footer-row">
    <div>Soft Matter &amp; Statistical Physics Group — IIT (BHU) Varanasi</div>
    <ul class="footer-links">
      <li><a href="mailto:awaneesh.phy@iitbhu.ac.in">Email</a></li>
      <li><a href="#people">People</a></li>
      <li><a href="#publications">Publications</a></li>
    </ul>
  </div>
</footer>

<script>
  // Content for each nav item lives in its own file under sections/.
  // This loads all six, drops them into <main>, then handles which one
  // is visible based on the URL hash (#home, #research, etc).
  var SECTION_IDS = ['home', 'research', 'publications', 'people', 'gallery', 'contact'];
  var root = document.getElementById('sectionsRoot');

  Promise.all(
    SECTION_IDS.map(function (id) {
      return fetch('sections/' + id + '.html').then(function (r) {
        if (!r.ok) throw new Error('Failed to load sections/' + id + '.html (' + r.status + ')');
        return r.text();
      });
    })
  ).then(function (htmlParts) {
    root.innerHTML = htmlParts.join('\n');
    forceCorrectVisibility();
    initPage();
  }).catch(function (err) {
    root.innerHTML =
      '<div class="wrap section-block"><p style="color:var(--ink-soft);">' +
      'Could not load the page content. If you just edited a file under sections/, ' +
      'double-check the filename matches exactly, then refresh.</p></div>';
    console.error(err);
  });

  // Safety net: no matter what the "hidden" attribute says in the raw
  // fragment files, force every section to the correct state up front,
  // based on the current hash. This is what fixes "home shows on every
  // page" if a fragment's hidden attribute got lost or duplicated.
  function forceCorrectVisibility() {
    var target = location.hash.replace('#', '') || 'home';
    if (SECTION_IDS.indexOf(target) === -1) target = 'home';
    SECTION_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.hidden = (id !== target);
    });
  }

  function initPage() {
    function showSection(id) {
      if (SECTION_IDS.indexOf(id) === -1) id = 'home';
      SECTION_IDS.forEach(function (s) {
        var el = document.getElementById(s);
        if (el) el.hidden = (s !== id);
      });
      document.querySelectorAll('nav a').forEach(function (a) {
        a.classList.toggle('active', a.dataset.target === id);
      });
    }

    window.addEventListener('hashchange', function () {
      showSection(location.hash.replace('#', ''));
      window.scrollTo(0, 0);
    });

    showSection(location.hash.replace('#', '') || 'home');

    var toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });

    // Hero image carousel: cross-fades between images every few seconds.
    (function () {
      var carousel = document.getElementById('heroCarousel');
      if (!carousel) return;
      var imgs = carousel.querySelectorAll('img');
      var caption = document.getElementById('heroCarouselCap');
      if (imgs.length < 2) return;
      var i = 0;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;
      setInterval(function () {
        imgs[i].classList.remove('is-active');
        i = (i + 1) % imgs.length;
        imgs[i].classList.add('is-active');
        if (caption) caption.textContent = imgs[i].getAttribute('data-caption') || '';
      }, 4500);
    })();

    // Flip cards in the People page.
    document.querySelectorAll('.member-card').forEach(function (card) {
      card.addEventListener('click', function () {
        card.classList.toggle('is-flipped');
      });
    });
  }
</script>

</body>
</html>
